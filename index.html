<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراجعة الحساب — الصف الأول | ASHWAA</title>
<style>
  :root{
    --cream:#FBEEE6;
    --sky:#EAF4FF;
    --ink:#26314E;
    --muted:#7C89A8;
    --purple:#6C63FF;
    --sunny:#FFC93C;
    --coral:#FF6B6B;
    --mint:#20C997;
    --sky2:#4CC9F0;
    --pink:#FF8FA3;
    --gold:#E8A100;
    --crimson:#C81D3C;
    --line:#EDE3F5;
    --shadow:0 12px 30px rgba(38,49,78,.12);
    --r:26px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 90% -10%, #FFE7C2 0%, transparent 60%),
      radial-gradient(800px 500px at 0% 100%, #D9F0FF 0%, transparent 60%),
      linear-gradient(170deg,var(--sky) 0%, var(--cream) 100%);
    color:var(--ink);
    min-height:100vh;padding:16px;overflow-x:hidden;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto}
  .ltr{direction:ltr;unicode-bidi:-webkit-isolate;unicode-bidi:isolate;display:inline-block}

  /* ===== الشريط العلوي ===== */
  .topbar{
    background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
    padding:12px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .logo{
    width:72px;height:72px;border-radius:20px;object-fit:cover;flex:none;
    border:3px solid var(--sunny);background:var(--cream);
  }
  .brand h1{margin:0;font-size:20px;font-weight:900}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .grow{flex:1}
  .chip{
    background:linear-gradient(135deg,var(--sunny),#FFB020);color:#5A3B00;
    font-weight:900;padding:10px 18px;border-radius:999px;font-size:16px;white-space:nowrap;
    box-shadow:0 6px 14px rgba(255,176,32,.35);
  }
  .chip .ltr{font-family:Verdana,Arial,sans-serif}

  /* ===== أدوات الصوت ===== */
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctrl{
    font:inherit;font-size:20px;line-height:1;border:2px solid var(--line);background:#fff;
    width:46px;height:46px;border-radius:14px;cursor:pointer;display:grid;place-items:center;
    -webkit-appearance:none;appearance:none;touch-action:manipulation;transition:.15s;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
  }
  .ctrl:hover{transform:translateY(-2px);border-color:var(--purple)}
  .ctrl.off{background:#FFECEC;border-color:var(--coral)}
  .vsel{
    font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:#fff;
    border:2px solid var(--line);border-radius:14px;padding:11px 10px;max-width:190px;cursor:pointer;
  }
  .hint{
    width:100%;background:#FFF7E6;border:2px dashed var(--sunny);border-radius:14px;
    padding:8px 12px;font-size:13px;font-weight:800;color:#8A5A00;display:none;
  }
  .hint.show{display:block}

  .card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:26px;position:relative;overflow:hidden}
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,var(--coral),var(--sunny),var(--mint),var(--sky2),var(--purple));
  }

  /* ===== شريط التقدم ===== */
  .bar{height:14px;background:#F0F3FA;border-radius:999px;overflow:hidden;margin:10px 0 6px;border:2px solid #fff}
  .bar > i{display:block;height:100%;width:0;border-radius:999px;transition:width .4s ease;
    background:linear-gradient(90deg,var(--mint),var(--sky2))}
  .bar-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:700;margin-bottom:16px}

  .badge{display:inline-block;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:900;margin-bottom:12px}

  /* ===== منطقة السؤال + الشخصية ===== */
  .qrow{display:flex;gap:18px;align-items:flex-start}
  .buddy{flex:none;width:150px;text-align:center}
  .buddy svg{width:150px;height:auto;display:block}
  .buddy .say{
    margin-top:6px;background:var(--cream);border:2px dashed var(--sunny);border-radius:16px;
    padding:8px 10px;font-size:14px;font-weight:800;color:#8A5A00;min-height:44px;display:grid;place-items:center;
  }
  .qmain{flex:1;min-width:0}
  @media(max-width:640px){
    .qrow{flex-direction:column;align-items:center}
    .buddy{width:130px}.buddy svg{width:130px}
    .qmain{width:100%}
  }

  .qhead{display:flex;align-items:flex-start;gap:10px}
  .q{font-size:25px;font-weight:900;line-height:1.7;margin:0 0 14px;flex:1}
  .say-again{
    font:inherit;font-size:20px;border:0;border-radius:14px;width:46px;height:46px;flex:none;
    background:linear-gradient(135deg,var(--sky2),#7ED4F5);color:#fff;cursor:pointer;
    box-shadow:0 4px 0 #1B9CD8;-webkit-appearance:none;appearance:none;touch-action:manipulation;
  }
  .say-again:active{transform:translateY(2px);box-shadow:0 2px 0 #1B9CD8}

  /* ===== التمرين الحسابي ===== */
  .expr{
    direction:ltr;unicode-bidi:-webkit-isolate;unicode-bidi:isolate;
    display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
    background:linear-gradient(135deg,#FFF7E6,#EAF6FF);
    border:3px dashed var(--sunny);border-radius:20px;padding:16px;margin-bottom:16px;
  }
  .expr .n,.expr .op,.expr .blank{
    font-family:Verdana,Arial,sans-serif;font-size:38px;font-weight:900;color:var(--ink);
  }
  .expr .op{color:var(--coral)}
  .expr .blank{
    display:inline-grid;place-items:center;min-width:62px;height:56px;border-radius:14px;
    background:#fff;border:3px solid var(--purple);color:var(--purple);
  }
  .visual{
    background:#F7FBFF;border:3px dashed var(--sky2);border-radius:20px;
    padding:14px;margin-bottom:16px;text-align:center;font-size:30px;line-height:1.7;
  }
  .visual svg{vertical-align:middle}

  /* ===== الصور والعدّ ===== */
  .pics{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;direction:ltr}
  .pics svg{width:54px;height:54px;display:block}
  .pics .gone{opacity:.28;filter:grayscale(.7)}
  .pics .plus{font-family:Verdana,Arial,sans-serif;font-size:36px;font-weight:900;color:var(--coral);margin:0 8px}
  .grp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
       background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 3px 10px rgba(38,49,78,.08)}
  .rowlab{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .rowlab .lab{font-size:16px;font-weight:900;color:var(--ink);background:#fff;border-radius:14px;
    padding:7px 14px;box-shadow:0 3px 10px rgba(38,49,78,.10);white-space:nowrap}
  @media(max-width:520px){.pics svg{width:44px;height:44px}}

  /* ===== الخيارات ===== */
  .opts{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px;gap:12px}
  @media(max-width:520px){.opts{grid-template-columns:1fr}}
  .opt{
    font:inherit;font-size:23px;font-weight:900;color:var(--ink);
    border:0;border-radius:20px;padding:16px 12px;cursor:pointer;transition:.15s;text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center;gap:10px;
    -webkit-appearance:none;appearance:none;touch-action:manipulation;
    -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-user-select:none;user-select:none;
  }
  .opt .ltr{font-family:Verdana,Arial,sans-serif}
  .opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.10)}
  .opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.10)}
  .opt:disabled{cursor:default;opacity:.75}
  .opt.correct{background:var(--mint)!important;color:#fff!important;opacity:1;animation:pop .4s}
  .opt.wrong{background:var(--coral)!important;color:#fff!important;opacity:1;animation:shake .4s}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .fb{margin-top:18px;padding:16px 20px;border-radius:20px;font-size:18px;font-weight:900;display:none;line-height:1.8}
  .fb.show{display:block;animation:pop .35s}
  .fb.good{background:#E4FBF2;color:#0E8A62;border:3px solid var(--mint)}
  .fb.bad{background:#FFF4E6;color:#B26A00;border:3px solid var(--sunny)}
  .fb .ltr{font-family:Verdana,Arial,sans-serif}

  .actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .btn{
    font:inherit;font-size:19px;font-weight:900;border:0;border-radius:18px;
    padding:14px 30px;cursor:pointer;color:#fff;transition:.15s;
    -webkit-appearance:none;appearance:none;touch-action:manipulation;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
    background:linear-gradient(135deg,var(--purple),#8A7BFF);box-shadow:0 6px 0 #4b45c2;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #4b45c2}
  .btn.green{background:linear-gradient(135deg,var(--mint),#3ddca6);box-shadow:0 6px 0 #0E8A62}
  .btn.big{font-size:24px;padding:18px 44px}
  .btn[hidden]{display:none}

  /* ===== شاشة البداية والنتيجة ===== */
  .center{text-align:center}
  .hero-logo{width:190px;border-radius:26px;border:4px solid var(--sunny);margin-bottom:14px}
  .h2{font-size:30px;font-weight:900;margin:6px 0}
  .sub{color:var(--muted);font-size:17px;font-weight:700;margin:0 0 20px}
  .tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
  .tag{padding:9px 18px;border-radius:999px;font-size:15px;font-weight:900;color:#fff}
  .stars{font-size:46px;letter-spacing:8px;margin-bottom:6px}
  .crown{font-size:60px;margin-bottom:4px}
  .big-msg{font-size:26px;font-weight:900;line-height:1.7;margin:10px auto 6px;max-width:560px}
  .big{font-family:Verdana,Arial,sans-serif;font-size:56px;font-weight:900;color:var(--purple);margin:8px 0;direction:ltr}
  .table{width:100%;border-collapse:separate;border-spacing:0 8px;margin:16px 0 22px;font-size:17px}
  .table td{padding:13px 14px;background:#F8FAFF;font-weight:800}
  .table td:first-child{border-radius:0 14px 14px 0;text-align:right}
  .table td:last-child{border-radius:14px 0 0 14px;text-align:center;font-family:Verdana,Arial,sans-serif;direction:ltr}
  .foot{
    display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--muted);font-size:13px;font-weight:800;margin:16px 0 6px;
  }
  .foot img{width:34px;height:34px;border-radius:10px;object-fit:cover;border:2px solid var(--sunny)}

  /* ===== قصاصات الاحتفال ===== */
  #conf{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:9}
  .cf{position:absolute;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
</style>
</head>

/* ==================================================================
   1) الأرقام بالحروف العربية — حتى ينطقها الصوت كلاماً مفهوماً
   ================================================================== */
const ONES = ['صفر','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة'];
const TEENS = ['','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const TENS = {2:'عشرون',3:'ثلاثون',4:'أربعون',5:'خمسون',6:'ستون',7:'سبعون',8:'ثمانون',9:'تسعون'};
function numAr(n){
  n = parseInt(n,10);
  if(isNaN(n)) return '';
  if(n <= 10) return ONES[n];
  if(n < 20) return TEENS[n-10];
  if(n === 100) return 'مئة';
  if(n > 100) return String(n);
  const t = Math.floor(n/10), o = n%10;
  return o ? (ONES[o] + ' و' + TENS[t]) : TENS[t];
}
/* تحويل أي نصّ فيه أرقام أو رموز إلى كلام عربي طبيعي */
function speakify(txt){
  if(!txt) return '';
  return String(txt)
    .replace(/<[^>]*>/g,' ')
    .replace(/&nbsp;/g,' ')
    .replace(/(\d+)\s*%/g, (m,d) => numAr(d) + ' بالمئة')
    .replace(/(\d+)\s*\/\s*(\d+)/g, (m,a,b) => numAr(a) + ' من ' + numAr(b))
    .replace(/\d+/g, m => numAr(m))
    .replace(/\+/g,' زائد ')
    .replace(/[−\-]/g,' ناقص ')
    .replace(/=/g,' يساوي ')
    .replace(/[🍎🏀🎈⭐🌸🎉👏💪🌟🏆🤗🚀🎈👑🔊🐦➕↺←؟?]/g,' ')
    .replace(/\s{2,}/g,' ')
    .trim();
}

/* ==================================================================
   2) محرّك الصوت — اختيار أفضل صوت عربي متوفّر + نطق طبيعي
   ================================================================== */
const synth = window.speechSynthesis;
let voices = [], myVoice = null, soundOn = true, voiceReady = false;

function voiceScore(v){
  const n = (v.name + ' ' + (v.voiceURI||'')).toLowerCase();
  let s = 0;
  if(/^ar/i.test(v.lang)) s += 200;
  if(/natural|neural|premium|enhanced|siri|online/.test(n)) s += 60;
  if(/google/.test(n)) s += 30;
  if(/hala|zariyah|salma|laila|layla|amina|hoda|maged|naayf|tarik/.test(n)) s += 20;
  if(v.localService) s += 3;
  return s;
}
function loadVoices(){
  const all = synth.getVoices ? synth.getVoices() : [];
  if(!all.length) return false;
  const ar = all.filter(v => /^ar/i.test(v.lang));
  voices = (ar.length ? ar : all).slice().sort((a,b) => voiceScore(b) - voiceScore(a));
  myVoice = voices[0] || null;
  const sel = document.getElementById('voices');
  sel.innerHTML = '';
  voices.forEach((v,k) => {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = v.name.replace(/Microsoft|Google|\(.*?\)/g,'').trim() || v.name;
    sel.appendChild(o);
  });
  sel.onchange = () => { myVoice = voices[sel.value]; speak('مرحباً! أنا صديقك في الحساب.'); };
  sel.style.display = voices.length ? '' : 'none';
  const hint = document.getElementById('hint');
  if(!ar.length){
    hint.className = 'hint show';
    hint.textContent = 'ملاحظة: لا يوجد صوت عربي مثبّت على هذا الجهاز، لذلك قد يكون النطق غير واضح. لأفضل صوت: افتح الملف بمتصفّح Chrome أو Edge على ويندوز، أو بمتصفّح Safari على الآيفون.';
  } else {
    hint.className = 'hint';
  }
  voiceReady = true;
  return true;
}
if(synth){
  loadVoices();
  synth.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 400);
  setTimeout(loadVoices, 1400);
  /* كروم يقطع الصوت الطويل — هذا يبقيه شغّالاً */
  setInterval(() => { try{ if(synth.speaking && !synth.paused) synth.resume(); }catch(e){} }, 7000);
}

/* تقطيع الكلام لجمل قصيرة = نَفَس طبيعي ووقفات مثل الإنسان */
function chunks(text){
  /* تقسيم الكلام إلى جمل قصيرة (بدون lookbehind حتى يعمل على كلّ الأجهزة) */
  const s = String(text).trim();
  const marks = '.!\u061F?\u060C:\u061B';
  const parts = [];
  let cur = '';
  for(let k = 0; k < s.length; k++){
    cur += s[k];
    if(marks.indexOf(s[k]) > -1 && cur.trim().length > 2){ parts.push(cur.trim()); cur = ''; }
  }
  if(cur.trim()) parts.push(cur.trim());

  const out = [];
  parts.forEach(p => {
    p = p.replace(/^[.\u060C:\u061B\s]+/, '').trim();
    if(!p) return;
    while(p.length > 150){
      let cut = p.lastIndexOf(' ', 150);
      if(cut < 60) cut = 150;
      out.push(p.slice(0, cut).trim());
      p = p.slice(cut).trim();
    }
    if(p) out.push(p);
  });
  return out.length ? out : [s];
}
function utter(text, rate, pitch){
  const u = new SpeechSynthesisUtterance(text);
  if(myVoice){ u.voice = myVoice; u.lang = myVoice.lang; } else { u.lang = 'ar-SA'; }
  u.rate = rate; u.pitch = pitch; u.volume = 1;
  return u;
}
/* speak: يقطع الكلام السابق ويقرأ الجديد
   say:   يضيف كلاماً بعد الكلام الحالي بدون قطع */
function say(text, opt){
  if(!soundOn || !synth || !text) return;
  const o = opt || {};
  const list = chunks(text);
  list.forEach((c,k) => {
    /* تغيير بسيط جداً بالسرعة والنبرة بين الجمل = إحساس طبيعي مش روبوت */
    const r = (o.rate || 0.92) + (k % 2 ? 0.03 : -0.02);
    const p = (o.pitch || 1.08) + (k % 3 === 0 ? 0.04 : 0);
    synth.speak(utter(c, r, p));
  });
}
function speak(text, opt){
  if(!synth) return;
  try{ synth.cancel(); }catch(e){}
  setTimeout(() => say(text, opt), 60);
}
function stopSpeak(){ try{ synth && synth.cancel(); }catch(e){} }

/* ==================================================================
   3) النغمات (Web Audio) — رنّات قصيرة + نغمة النهاية
   ================================================================== */
let AC = null;
function ac(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq, at, dur, type, vol){
  const c = ac(); if(!c || !soundOn) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t = c.currentTime + at;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.25));
  o.start(t); o.stop(t + (dur || 0.25) + 0.06);
}
function play(notes){ notes.forEach(n => tone(n[0], n[1], n[2], n[3], n[4])); }

/* تغميق اللون لاستعماله كإطار للشكل */
function dark(hex){
  const h = (hex||'#FF6B6B').replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
  const r = Math.round(((n>>16)&255)*0.6), g = Math.round(((n>>8)&255)*0.6), b = Math.round((n&255)*0.6);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* صفّ صور: item = دالة ترجع SVG ، n = العدد ، gone = كم واحد "راح" */
function pics(item, n, gone){
  let s = '';
  for(let k = 0; k < n; k++){
    const off = (gone && k >= n - gone) ? ' class="gone"' : '';
    s += '<span' + off + '>' + item() + '</span>';
  }
  return '<div class="pics">' + s + '</div>';
}
/* مجموعتان مع إشارة الجمع */
function picsAdd(item, a, b){
  let g1 = '', g2 = '';
  for(let k = 0; k < a; k++) g1 += item();
  for(let k = 0; k < b; k++) g2 += item();
  return '<div class="pics"><span class="grp">' + g1 + '</span>' +
         '<span class="plus">+</span><span class="grp">' + g2 + '</span></div>';
}
/* صفوف مع أسماء (مثلاً: أحمد ... ليلى ...) */
function picsRows(rows){
  return rows.map(r => {
    let g = '';
    for(let k = 0; k < r.n; k++) g += r.item();
    return '<div class="rowlab"><span class="lab">' + r.label + '</span>' +
           '<div class="pics">' + g + '</div></div>';
  }).join('');
}

/* صور بألوان مختلفة (للسؤال: كم كرة حمراء؟) */
function picsMix(item, colors){
  let s = '';
  colors.forEach(c => { s += '<span>' + item(c) + '</span>'; });
  return '<div class="pics">' + s + '</div>';
}

const stage = document.getElementById('stage');
const chip  = document.getElementById('chip');
const setChip = () => chip.innerHTML = 'النتيجة: <span class="ltr">' + score + '</span>';

/* زر الصوت */
const soundBtn = document.getElementById('sound');
soundBtn.onclick = () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.className = 'ctrl' + (soundOn ? '' : ' off');
  if(!soundOn) stopSpeak(); else speak('رجع الصوت! يلّا نكمّل.');
};

/* نصّ السؤال المنطوق */
function questionSpeech(q){
  let t = q.sayQ ? q.sayQ : speakify(q.q);
  if(q.expr){
    const e = q.expr.map(x => {
      if(x === '?') return 'كم';
      if(x === '+') return 'زائد';
      if(x === '−' || x === '-') return 'ناقص';
      if(x === '=') return 'يساوي';
      if(x === '،') return '،';
      return numAr(x);
    }).join(' ');
    t += '. ' + e;
  }
  return t;
}
function optionsSpeech(q){
  const list = q.opts.map(o => speakify(o)).join('، ');
  return 'الخيارات هي: ' + list + '.';
}

/* ---- شاشة البداية ---- */
function start(){
  let tags = '';
  for(const s in per) tags += `<span class="tag" style="background:${SEC_COLOR[s]}">${s}</span>`;
  stage.innerHTML = `
    <div class="center">
      <img class="hero-logo" src="${LOGO}" alt="ASHWAA">
      <div class="h2">أهلاً بك في مراجعة الحساب 🎈</div>
      <p class="sub"><span class="ltr">${Q.length}</span> سؤالاً ممتعاً للصف الأول — كلّ سؤال بينحكى بالصوت، وصديقنا بيشجّعك بعد كلّ إجابة</p>
      <div class="tags">${tags}</div>
      <div style="display:flex;justify-content:center;margin-bottom:10px">
        <div style="width:160px">${kid('think')}</div>
      </div>
      <button class="btn green big" id="go">🚀 ابدأ</button>
    </div>`;
  document.getElementById('go').onclick = () => {
    ac();                      /* تشغيل الصوت بعد أوّل ضغطة (شرط المتصفّحات) */
    SND.click();
    /* أوّل نطق لازم يكون داخل ضغطة الإصبع مباشرة (شرط آيفون/سفاري) */
    say('هيّا نبدأ! إنت عبقري، وسوف تنجح.', {rate:0.9, pitch:1.12});
    setTimeout(() => render(true), 2600);
  };
}

/* ---- شاشة السؤال ---- */
function render(withIntroPause){
  const q = Q[i];
  answered = false;
  setChip();
  const col = SEC_COLOR[q.sec];

  let exprHtml = '';
  if(q.expr){
    exprHtml = '<div class="expr">' + q.expr.map(t => {
      if(t === '?') return '<span class="blank">؟</span>';
      if(/^[0-9]+$/.test(t)) return '<span class="n">' + t + '</span>';
      return '<span class="op">' + t + '</span>';
    }).join('') + '</div>';
  }

  stage.innerHTML = `
    <div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div>
    <div class="bar-meta">
      <span>سؤال <span class="ltr">${i+1}</span> من <span class="ltr">${Q.length}</span></span>
      <span style="color:${col}">${q.sec}</span>
    </div>
    <div class="qrow">
      <div class="buddy">
        <div id="face">${kid('think')}</div>
        <div class="say" id="say">فكّر جيّداً... 🤔</div>
      </div>
      <div class="qmain">
        <span class="badge" style="background:${col}22;color:${col}">${q.sec}</span>
        <div class="qhead">
          <p class="q">${q.q}</p>
          <button class="say-again" id="rep" title="اسمع السؤال مرّة ثانية">🔊</button>
        </div>
        ${exprHtml}
        ${q.visual ? `<div class="visual">${q.visual}</div>` : ``}
        <div class="opts" id="opts"></div>
        <div class="fb" id="fb"></div>
        <div class="actions"><button class="btn" id="next" hidden>التالي ←</button></div>
      </div>
    </div>`;

  const box = document.getElementById('opts');
  q.opts.forEach((t, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.style.background = OPT_COLORS[idx % OPT_COLORS.length];
    b.innerHTML = /^[0-9\s،]+$/.test(t) ? '<span class="ltr">' + t + '</span>' : t;
    b.onclick = () => choose(idx, b);
    box.appendChild(b);
  });
  document.getElementById('next').onclick = next;

  const readAll = () => speak(questionSpeech(q) + '. ' + optionsSpeech(q));
  document.getElementById('rep').onclick = () => { SND.click(); readAll(); };
  setTimeout(readAll, withIntroPause ? 120 : 260);
}

/* ---- اختيار إجابة ---- */
function choose(idx, btn){
  if(answered) return;
  answered = true;
  stopSpeak();
  const q = Q[i];
  const bs = [...document.querySelectorAll('.opt')];
  bs.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  const face = document.getElementById('face');
  const sayBox = document.getElementById('say');

  if(idx === q.ans){
    score++; per[q.sec].ok++;
    btn.classList.add('correct');
    face.innerHTML = kid('happy');
    const line = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    sayBox.textContent = line;
    fb.className = 'fb good show';
    fb.innerHTML = '🎉 ' + line + '<br>' + q.why;
    SND.correct();
    confetti();
    setTimeout(() => { speak(line + ' ' + speakify(q.why)); }, 520);
  } else {
    btn.classList.add('wrong');
    bs[q.ans].classList.add('correct');
    face.innerHTML = kid('cheer');
    const line = SORRY[Math.floor(Math.random() * SORRY.length)];
    sayBox.textContent = line;
    fb.className = 'fb bad show';
    fb.innerHTML = '💪 ' + line + '<br>الإجابة الصحيحة هي: <b>' + q.opts[q.ans] + '</b><br>' + q.why;
    SND.wrong();
    setTimeout(() => {
      speak(line + ' الإجابة الصحيحة هي ' + speakify(q.opts[q.ans]) + '. ' + speakify(q.why));
    }, 520);
  }
  setChip();
  const nx = document.getElementById('next');
  nx.hidden = false;
  nx.textContent = (i === Q.length - 1) ? 'شاهد النتيجة 🎉' : 'التالي ←';
}

function next(){
  SND.click();
  if(i < Q.length - 1){ i++; render(); } else finish();
}

/* ---- شاشة النتيجة ---- */
function finish(){
  stopSpeak();
  const pct = Math.round(score / Q.length * 100);

  let title, msg, icon, tune, showConf;
  if(pct >= 95){
    icon = '👑';
    title = 'إنت ملك الحساب!';
    msg = 'مبروك مبروك! إنت ملك الحساب 🏆';
    tune = SND.king;
    showConf = 60;
  } else if(pct >= 85){
    icon = '🌟';
    title = 'مبروك! أحسنت';
    msg = 'مبروك، أحسنت! فاضل خطوة بسيطة بس لتصير ملك الحساب 💪';
    tune = SND.great;
    showConf = 34;
  } else {
    icon = '🤗';
    title = 'ما تقلق أبداً';
    msg = 'ما تقلق! كمان شويّة مثابرة ورح تصير ملك بالحساب 🌟';
    tune = SND.keep;
    showConf = 0;
  }

  const stars = pct>=95?'⭐⭐⭐⭐⭐':pct>=85?'⭐⭐⭐⭐':pct>=70?'⭐⭐⭐':pct>=50?'⭐⭐':'⭐';

  let rows = '';
  for(const s in per) rows += `<tr><td style="border-right:6px solid ${SEC_COLOR[s]}">${s}</td>
     <td>${per[s].ok} / ${per[s].all}</td></tr>`;

  stage.innerHTML = `
    <div class="center">
      <div class="crown">${icon}</div>
      <div style="display:flex;justify-content:center"><div style="width:150px">${kid(pct>=85?'happy':'cheer')}</div></div>
      <div class="stars">${stars}</div>
      <div class="h2">انتهت المراجعة!</div>
      <div class="big">${score} / ${Q.length}</div>
      <div class="big-msg">${msg}</div>
      <p class="sub">نتيجتك: <span class="ltr">${pct}%</span></p>
      <table class="table">${rows}</table>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn green" id="again">إعادة المراجعة ↺</button>
        <button class="btn" id="hear">🔊 اسمع النتيجة</button>
      </div>
    </div>`;

  if(showConf) confetti(showConf);
  tune();

  const spoken = 'انتهت المراجعة! جاوبت صح على ' + numAr(score) + ' من ' + numAr(Q.length) +
                 '، أي ' + numAr(pct) + ' بالمئة. ' + speakify(msg);
  setTimeout(() => speak(spoken, {rate:0.9, pitch:1.1}), pct >= 95 ? 1900 : 1400);

  document.getElementById('hear').onclick = () => { tune(); setTimeout(() => speak(spoken), 900); };
  document.getElementById('again').onclick = () => {
    SND.click();
    i = 0; score = 0;
    for(const s in per) per[s].ok = 0;
    speak('يلّا نعيد من جديد! إنت عبقري وسوف تنجح.');
    setTimeout(() => render(true), 2200);
  };
}

/* ---- قصاصات ملوّنة ---- */
function confetti(n){
  const box = document.getElementById('conf');
  const cols = ['#FFC93C','#FF6B6B','#20C997','#4CC9F0','#6C63FF','#FF8FA3'];
  for(let k = 0; k < (n || 20); k++){
    const d = document.createElement('div');
    d.className = 'cf';
    d.style.left = Math.random()*100 + 'vw';
    d.style.top = '-30px';
    d.style.background = cols[k % cols.length];
    d.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    d.style.animationDelay = (Math.random()*.35) + 's';
    box.appendChild(d);
    setTimeout(() => d.remove(), 3400);
  }
}

start();
</script>
</body>
</html>
